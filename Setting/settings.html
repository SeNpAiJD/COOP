<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings — Coop POS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Work+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="settings.css">
<script src="../theme-engine.js"></script>
<script src="lang/translations.js"></script>
<script src="lang/language-engine.js"></script>
</head>
<body>

<div class="kiosk">
  <div class="settings-container">
    <a href="../index.html" class="back-link" data-i18n="settings.home">← Return to Home</a>

    <div class="settings-list">
      <a href="theme/theme.html" class="settings-link">
        <span class="s-icon">🎨</span>
        <span class="s-text">
          <span class="s-title" data-i18n="settings.theme">Theme</span><br>
          <span class="s-sub" data-i18n="settings.themeSub">Change the background color</span>
        </span>
        <span class="s-swatch" data-i18n-title="settings.currentBg" title="Current background"></span>
        <span class="s-arrow">›</span>
      </a>

      <a href="lang/lang.html" class="settings-link">
        <span class="s-icon">🌐</span>
        <span class="s-text">
          <span class="s-title" data-i18n="settings.language">Language</span><br>
          <span class="s-sub" data-i18n="settings.languageSub">English or Tagalog</span>
        </span>
        <span class="s-arrow">›</span>
      </a>
    </div>
  </div>
</div>

</body>
</html>
